<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>单选按钮、复选框、下拉列表、文本域</title>
	</head>
	<body>
		<form action="" name="myForm">
			<input type="radio" name="status" value="married" id="r1" checked/><label for="r1">已婚</label>
			<input type="radio" name="status" value="unmarried" id="r2"/><label for="r2">未婚</label>
			<br />
			<input  type="checkbox" name="fruit" value="" id="c1" checked/><label for="c1">西瓜</label>
			<input  type="checkbox" name="fruit" value="" id="c2"/><label for="c2">葡萄</label>
			<input  type="checkbox" name="fruit" value="" id="c3"/><label for="c3">苹果</label>
			<input  type="checkbox" name="fruit" value="" id="c4" checked/><label for="c4">其他</label>
			<br />
			<select name="course">
				<option value="01">课程1</option>
				<option value="02">课程2</option>
				<option value="03">课程3</option>
				<option value="04">课程4</option>
			</select>
		</form>
	</body>
</html>
