<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>浮动特殊性——父元素塌陷</title>
		<style>
			div p{
				width: 150px;
				border: 1px solid black;
				margin-right: 10px;
			}
			div{
				border: 1px solid black;
			}
		</style>
	</head>
	<body>
		<h3>浮动布局模型</h3>
		<div>
			<p>这是第一段文本，这是第一段文本，这是第一段文本。</p>
			<p>这是第二段文本，这是第二段文本，这是第二段文本。</p>
			<p>这是第三段文本，这是第三段文本，这是第三段文本。</p>
		</div>
		<h3>这是一个新标题</h3>
	</body>
</html>
