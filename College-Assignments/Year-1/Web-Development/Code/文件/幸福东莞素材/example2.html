<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>浮动float</title>
		<style type="text/css">
			div{
				width:450px;
				border: 1px solid black;
			}
			img{
				float: right;
			}
		</style>
	</head>
	<body>
		<div>
			<img src="imgs/flower.jpg">
			<p>鸡蛋花主要分布在我国广东、广西、云南、福建等地，因为花与鸡蛋相似而得名。鸡蛋花经晒干后可以作为一种中药，具有清热解毒、润肺止咳，治疗咽炎、咽喉疼痛等疾病。</p>
		</div>
	</body>
</html>
