<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>translate用法</title>
		<style type="text/css">
			div{
				width: 80px;
				height: 40px;
				border: 1px solid black;
				margin: 30px;
				background-color: yellow;
			}
			#box2{
				transform: translate(50px,50px);
				-webkit-transform: translate(50px,-50px);
				-moz-transform: translate(50px,-50px);
			}
		</style>
	</head>
	<body>
		<div id="box1">未平移</div>
		<div id="box2">平移</div>
	</body>
</html>
