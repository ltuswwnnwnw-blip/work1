<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>linear-gradient用法</title>
		<style type="text/css">
			div{
				width: 300px;
				height: 100px;
				border: 2px solid black;
				margin: 10px;
				text-align: center;
				line-height: 100px;
				background-image: linear-gradient(to right,#ff0000 10%,#ffff7f 20%,#0000ff 70%);
			}
		</style>
	</head>
	<body>
		<div>线性渐变</div>
	</body>
</html>
