<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>过渡与形变的应用</title>
	</head>
	<style>
		
		nav{
			width: 650px;
			border: 1px solid gray;
			margin: 50px auto;
			display: flex;
		}
		nav a{
			flex: 1;
			text-align: center;
			color: #ffffff;
			height: 50px;
			line-height: 50px;
			transition: 0.5s all ease-out;
			margin-right: 8px;
			position: relative;
		}
		nav a:hover{
			transform: translate(-9px,-18px) 
		}
		nav a::after{
			content: '';
			top: 0;
			left: 0;
			position: absolute;
			width: 100%;
			height: 100%;
			transform: skew(20deg);
			box-shadow: 5px 5px 10px 2px gray ;
			z-index: -1;
			border-radius: 6px 6px 6px 6px;
			background-image: linear-gradient(to right,#ff0000 10%,#ffff7f 20%,#0000ff 70%);
			}
	</style>
	<body>
		<nav>
			<a href="#">首页</a>
			<a href="#">关注</a>
			<a href="#">推荐</a>
			<a href="#">视频</a>
			<a href="#">娱乐</a>
		</nav>
	</body>
</html>
