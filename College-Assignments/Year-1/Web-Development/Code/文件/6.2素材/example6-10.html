<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>transform-origin用法</title>
		<style type="text/css">
			div{
				width: 80px;
				height: 40px;
				border: 1px solid black;
				margin: 30px;
				background-color: yellow;
			}
			#box2{
				transform: scale(10);
				transform-origin: 0px 0px 0px;
			}
		</style>
	</head>
	<body>
		<div id="box1">未更改基点</div>
		<div id="box2">更改基点</div>
	</body>
</html>
