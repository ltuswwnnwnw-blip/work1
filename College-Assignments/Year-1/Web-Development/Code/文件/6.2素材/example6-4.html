<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>过渡效果复杂用法</title>
		<style type="text/css">
			div{
				width: 100px;
				height: 100px;
				border: 1px solid black;
				
				transition-property: width,height;
				transition-duration: 0.1s;
				transition-timing-function: ease-in;
				transition-delay: 0.05s;
				
			}
			div:hover{
				width: 200px;
				height: 50px;
			}
		</style>
	</head>
	<body>
		<div>鼠标经过变长变矮，鼠标移开变短变高</div>
	</body>
</html>
