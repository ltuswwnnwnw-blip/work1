<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>skew用法</title>
		<style type="text/css">
			div{
				width: 80px;
				height: 40px;
				border: 1px solid black;
				margin: 30px;
				background-color: yellow;
			}
			#box2{
				transform: skew(45deg,-10deg);
			}
		</style>
	</head>
	<body>
		<div id="box1">未倾斜</div>
		<div id="box2">倾斜</div>
	</body>
</html>
