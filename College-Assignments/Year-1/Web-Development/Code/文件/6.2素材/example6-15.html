<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>radial-gradient用法</title>
		<style type="text/css">
			div{
				width: 150px;
				height: 100px;
				line-height: 100px;
				border: 2px solid black;
				text-align: center;
				display: inline-block;
				margin: 10px;
			}
			div:nth-child(1){
				background-image: radial-gradient(closest-side at 25% 60%,#ff0000 10%,#ffff7f 20%,#0000ff 70%);
			}
			div:nth-child(2){
				background-image: radial-gradient(farthest-side at 25% 60%,#ff0000 10%,#ffff7f 20%,#0000ff 70%);
			}
		</style>
	</head>
	<body>
		<div>closest-side</div><div>farthest-side</div>
	</body>
</html>
