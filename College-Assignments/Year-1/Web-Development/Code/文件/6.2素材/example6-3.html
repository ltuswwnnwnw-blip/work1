<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>过渡效果基本用法</title>
		<style type="text/css">
			div{
				width: 100px;
				height: 100px;
				padding: 20px;
				border: 3px solid black;
				transition-property: border-radius,width;
				transition-duration: 0.5s;
				transition-timing-function: ease-in;
				transition-delay: 0.5s;
			}
			div:hover{
				border-radius: 50px;/*过渡动画最终状态*/
				width: 120px;
			}			
		</style>
	</head>
	<body>
		<div>鼠标经过是圆，鼠标移开是矩形</div>
	</body>
</html>
