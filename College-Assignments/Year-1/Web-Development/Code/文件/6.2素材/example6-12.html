<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>border-radius用法</title>
		<style type="text/css">
			div{
				width: 100px;
				height: 100px;
				border: 2px solid black;
				display: inline-block;
				margin: 10px;
				text-align: center;
				line-height: 100px;
			}
			div:nth-child(1){
				border-radius: 25px 45px 10px 35px;
			}
			div:nth-child(2){
				border-radius: 25px 45px 10px;
			}
			div:nth-child(3){
				border-radius: 25px 25px;
			}
			div:nth-child(4){
				border-radius: 25px;
			}
			
		</style>
	</head>
	<body>
		<div>4个角</div><div>3个角</div><div>2个角</div><div>1个角</div>
	</body>
</html>
