<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>box-shadow用法</title>
		<style type="text/css">
			div{
				width: 100px;
				height: 100px;
				border: 2px solid black;
				display: inline-block;
				margin: 10px;
				text-align: center;
				line-height: 100px;
			}
			div:nth-child(1){
				box-shadow: 5px 5px 10px 2px gray inset;
			}
			div:nth-child(2){
				box-shadow: 5px 5px 10px 2px gray ;
			}
			div:nth-child(1){
				
			}
			div:nth-child(1){
				
			}
		</style>
	</head>
	<body>
		<div>内阴影</div><div>外阴影</div>
	</body>
</html>
