<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>百分比布局</title>
		<style>
			/* 整体宽度占浏览器宽度的95%，其中侧边栏占25%，文章占剩余宽度。 */
			body *{				margin: 10px auto 0 auto;
				border: 1px solid black;
				padding: 5px;		  	}			main{
				border: none;
				padding: 0;
				display: flex;
				height: 500px;
			}
			header,nav,main,footer{
				width: 95%;
			}
			aside{
				width: 25%;
				margin-right: 10px;
			}
			article{
				flex: 1;
			}
		</style>
	</head>
	<body>
		<header>头部</header>		<nav>导航</nav>		<main>			<aside>侧边栏</aside>			<article>文章</article>		</main>		<footer>页脚</footer>
	</body>
</html>
