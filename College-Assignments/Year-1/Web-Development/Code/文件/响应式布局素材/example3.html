<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>“媒体查询+百分比布局”实现响应式页面</title>
		<style>
			body *{
					margin: 10px auto 0 auto;
					border: 1px solid black;
					padding: 5px;
			  	}
				main{
					border: none;
					padding: 0;
					display: flex;
					height: 500px;
				}
				header,nav,main,footer{
					width: 95%;
				}
				aside{
					width: 25%;
					margin-right: 10px;
				}
				article{
					flex: 1;
				}
				@media screen and (max-width:576){
					aside{
						display: none;
					}
				}
			/* 在example2.html基础上实现:当浏览器屏幕宽度小于576px时，侧边栏隐藏，文章占100%。 */
		</style>
	</head>
	<body>
		<header>头部</header>		<nav>导航</nav>		<main>			<aside>侧边栏</aside>			<article>文章</article>		</main>		<footer>页脚</footer>
	</body>
</html>
