<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>animation简单用法</title>
		<style>
			div{
				width: 50px;
				height: 50px;
				border: 1px solid black;
				margin: 50px;
			}
			@keyframes change{
				from{transform: scale(0.7);}
				40%,70%{transform: scale(1.5);}
				to{transform: scale(1);}
			}
		</style>
	</head>
	<body>
		<div>动画</div>
	</body>
</html>
