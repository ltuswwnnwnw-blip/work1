<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>视频的嵌入</title>
		<style type="text/css">
			#myVideo{
				width: 500px;
				height: 200px;
				background-color: black;
			}
			video{
				height: 200px;
				margin: 0 auto;
				display: block;
			}
		</style>
	</head>
	<body>
		<div id="myVideo">
			<video src="media/travel.mp4" controls autoplay loop>
				浏览器不支持video标签
			</video>
			
		</div>
	</body>
</html>
