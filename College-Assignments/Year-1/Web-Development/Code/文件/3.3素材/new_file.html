<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>东莞名胜</title>
	</head>
	<style>
		*{
			list-style-type: none;
			margin: 0;
			padding: 0;
		}
		#box{
			width: 480px;
			margin: auto;
		}
		div ul{
			display: flex;
			flex-wrap: wrap;
			gap: 15px;
			padding: 0px;
		}
		div li{
			width: 30.333%;
			position: relative;
			background-color: gainsboro;
			width: 150px;
		}
		div img{
			display: block;
			width: 150px;
		}
		span{
			position: absolute;
			left: 0px;
			top: 0px;
			background-color: #ff0000;
			color: #000;
			display: block;
			padding: 4px;
		}
		h4{
			color: #000000;
			padding-left: 5px;
		}
		p{
			padding-left: 5px;
		}
		.line{
			width: 100%;
			border-bottom: 1px dashed gray;
			margin: 5px 0;
		}
	</style>
	<body>
		<div id="box">
		<ul>
			<li class="m">
				<img src="imgs/01.jpg"/>
				<span>e1</span>
				<h4>可园</h4>
				<p>莞城区可园路32号</p>
			</li>
			<li class="m">
				<img src="imgs/02.jpg">
				<span>e2</span>
				<h4>观音山森林公园</h4>
				<p>樟木头镇笔架山大道</p>
			</li>
			<li class="m">
				<img src="imgs/03.jpg">
				<span>e3</span>
				<h4>松湖烟雨</h4>
				<p>松山湖大学路</p>
			</li>
			<div class="line"></div>
			<li>
				<img src="imgs/04.jpg">
				<span>e4</span>
				<h4>银瓶山森林公园</h4>
				<p>东莞市谢岗镇</p>
			</li>
			<li>
				<img src="imgs/05.jpg">
				<span>e5</span>
				<h4>粤晖园</h4>
				<p>道滘镇粤晖园1号</p>
			</li>
			<li>
				<img src="imgs/06.jpg">
				<span>e6</span>
				<h4>虎门炮台</h4>
				<p>虎门镇南面村</p>
			</li>
		</ul>
		</div>
	</body>
</html>
