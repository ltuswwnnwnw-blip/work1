<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>相对定位</title>
		<style type="text/css">
			div{ 
				width: 150px;	
				height: 100px; 
			}
			#box1{ 
				background-color:red;
				position: relative;
			}
			#box2{ 
				background-color:yellow;
				position: absolute;
				
			}
			#box3{ 
				background-color:green;
				position: absolute;
				top: 120px;
				}
		</style>
	</head>
	<body>
		<div id="box1">box1</div>
		<div id="box2">box2</div>
		<div id="box3">box3</div>
	</body>
</html>
