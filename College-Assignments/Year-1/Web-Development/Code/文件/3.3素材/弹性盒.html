<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>弹性盒</title>
		<style>
			#box{
				background-color: #999;
				width: 300px;
				height: 200px;
				display: flex;
				flex-grow: row-reverse nowrap;
				justify-content: center;
				align-items: center;
			}
			#box div{
				background-color: white;
				border: 1px solid gray;
				margin: 2px;
				height: 100px;
			}
			#box div:nth-child(1){
				order: 2;
				width: 50px;
			}
			#box div:nth-child(2){
				order: 1;
				width: 50px;
			}
			#box div:nth-child(3){
				order: 3;
				flex: 1;
			}
			
		</style>
	</head>
	<body>
		<div id="box">
			<div id="one">one</div>
			<div id="two">two</div>
			<div id="three">three</div>
		</div>
	</body>
</html>
