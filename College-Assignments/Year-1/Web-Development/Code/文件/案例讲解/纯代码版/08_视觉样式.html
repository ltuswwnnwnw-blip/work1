<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>视觉样式：渐变 阴影 圆角</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"微软雅黑",sans-serif; background:#f5f5f5; padding:30px; }
.container { max-width:650px; margin:0 auto; }
h2 { text-align:center; margin:20px 0; color:#333; }

.row { display:flex; flex-wrap:wrap; gap:15px; justify-content:center; }
.item { width:120px; height:120px; display:flex; align-items:center; justify-content:center; color:#fff; border-radius:8px; font-size:13px; text-align:center; }

.item1 { background:linear-gradient(135deg,#667eea,#764ba2); border-radius:50%; }
.item2 { background:#3498db; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.2); }
.item3 { background:#e74c3c; border-radius:4px; box-shadow:inset 0 0 20px rgba(0,0,0,0.3); }
.item4 { background:radial-gradient(circle,#ff6b6b,#c0392b); border-radius:8px; }
</style>
</head>
<body>
<div class="container">
<h2>渐变、阴影、圆角</h2>
<div class="row">
    <div class="item item1">线性渐变<br>+ 圆形</div>
    <div class="item item2">圆角<br>+ 外阴影</div>
    <div class="item item3">内阴影</div>
    <div class="item item4">径向渐变</div>
</div>
</div>
</body>
</html>
