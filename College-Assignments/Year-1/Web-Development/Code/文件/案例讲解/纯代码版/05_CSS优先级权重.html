<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CSS优先级 - 权重计算</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"微软雅黑",sans-serif; background:#f5f5f5; padding:30px; color:#333; }
.container { max-width:600px; margin:0 auto; }
h2 { text-align:center; margin-bottom:20px; }

.row { display:flex; gap:15px; margin-bottom:15px; }
.col { flex:1; padding:12px; border-radius:6px; text-align:center; }

#content .book { font-size:28px; }
p span { font-size:20px; }
.book { font-size:24px; }
#content span { font-size:26px; }
</style>
</head>
<body>
<div class="container">
<h2>同一元素被多个规则选中 → 权重高者胜出</h2>
<div class="row">
    <div class="col" style="background:#e8f8f5;border:2px solid #27ae60;">
        <strong>#id .class</strong><br>权重 100+10=110<br>
        <span style="font-size:28px;color:#27ae60;">28px ✅</span>
    </div>
    <div class="col" style="background:#fef9e7;border:2px solid #f39c12;">
        <strong>.class</strong><br>权重 10<br>
        <span style="font-size:24px;color:#f39c12;">24px</span>
    </div>
    <div class="col" style="background:#fdedec;border:2px solid #e74c3c;">
        <strong>p span</strong><br>权重 1+1=2<br>
        <span style="font-size:20px;color:#e74c3c;">20px</span>
    </div>
</div>

<div style="background:#fff;border-radius:8px;padding:20px;text-align:center;">
    <p id="content"><span class="book">《黄帝内经》</span>奠定了人体生理、病理、诊断以及治疗的认识基础。</p>
    <p style="color:#888;margin-top:8px;">#content .book(110) 胜出 → 28px</p>
</div>
</div>
</body>
</html>
