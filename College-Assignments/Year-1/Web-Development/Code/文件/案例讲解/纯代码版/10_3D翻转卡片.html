<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>3D翻转卡片</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"微软雅黑",sans-serif; background:#f5f5f5; padding:30px; }
h2 { text-align:center; margin:20px 0; color:#333; }

.card-container { perspective:800px; width:200px; height:200px; margin:20px auto; }
.card { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform 0.8s; cursor:pointer; }
.card:hover { transform:rotateY(180deg); }

.front, .back { position:absolute; width:100%; height:100%; display:flex; align-items:center; justify-content:center; border-radius:10px; font-size:18px; color:#fff; backface-visibility:hidden; }
.front { background:blue; }
.back { background:red; transform:rotateY(180deg); }
</style>
</head>
<body>
<h2>鼠标放上去看翻转效果</h2>
<div class="card-container">
    <div class="card">
        <div class="front">正面</div>
        <div class="back">背面</div>
    </div>
</div>
</body>
</html>
