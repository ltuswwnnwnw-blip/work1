<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>响应式布局</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"微软雅黑",sans-serif; background:#f5f5f5; padding:20px; color:#333; }
.container { max-width:900px; margin:0 auto; }
h2 { text-align:center; margin:20px 0; }

.grid { display:flex; flex-wrap:wrap; gap:10px; }
.card { width:calc((100% - 30px) / 4); background:#3498db; color:#fff; padding:20px; text-align:center; border-radius:6px; transition:background 0.3s; }
.card:nth-child(odd) { background:#2ecc71; }

@media (max-width:768px) { .card { width:calc((100% - 10px) / 2); } }
@media (max-width:480px) { .card { width:100%; } }

.info { text-align:center; color:#888; margin:10px 0; font-size:14px; }
</style>
</head>
<body>
<div class="container">
<h2>大屏4列 → 平板2列 → 手机1列</h2>
<p class="info">缩小浏览器窗口看效果</p>
<div class="grid">
    <div class="card">卡片 1</div>
    <div class="card">卡片 2</div>
    <div class="card">卡片 3</div>
    <div class="card">卡片 4</div>
    <div class="card">卡片 5</div>
    <div class="card">卡片 6</div>
    <div class="card">卡片 7</div>
    <div class="card">卡片 8</div>
</div>
</div>
</body>
</html>
