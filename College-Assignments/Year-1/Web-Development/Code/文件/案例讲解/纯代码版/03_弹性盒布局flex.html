<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>弹性盒布局 flex</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "微软雅黑", sans-serif; background: #f5f5f5; padding: 30px; color: #333; }
.container { max-width: 750px; margin: 0 auto; }
h2 { text-align: center; margin: 20px 0; }
.demo { background: #fff; border-radius: 8px; padding: 20px; margin: 20px 0; }

.flex-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 15px 0; }
.flex-item { background: #3498db; color: #fff; padding: 20px; text-align: center; border-radius: 4px; }
.flex-item.grow { flex: 1; }
.flex-item.w3 { width: calc((100% - 20px) / 3); }

.flex-demo2 { display: flex; gap: 10px; margin: 15px 0; align-items: center; }
.flex-demo2 .flex-item { flex: 1; }
.flex-demo2 .flex-item.double { flex: 2; }
</style>
</head>
<body>
<div class="container">

<h2>flex + flex-wrap + gap：自动换行网格</h2>
<div class="demo">
    <div class="flex-row">
        <div class="flex-item w3">卡片 1</div>
        <div class="flex-item w3">卡片 2</div>
        <div class="flex-item w3">卡片 3</div>
        <div class="flex-item w3">卡片 4</div>
        <div class="flex-item w3">卡片 5</div>
        <div class="flex-item w3">卡片 6</div>
    </div>
</div>

<h2>flex: 1 弹性分配</h2>
<div class="demo">
    <div class="flex-demo2">
        <div class="flex-item">flex: 1</div>
        <div class="flex-item">flex: 1</div>
        <div class="flex-item double">flex: 2（多一倍）</div>
    </div>
</div>

</div>
</body>
</html>
