<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>表单数据验证</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"微软雅黑",sans-serif; background:#f5f5f5; padding:30px; }

.form { background:#fff; border-radius:8px; padding:25px; max-width:420px; margin:0 auto; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
.form h2 { text-align:center; margin-bottom:20px; }
.row { display:flex; align-items:center; margin-bottom:12px; }
.row label { width:75px; text-align:right; padding-right:10px; font-size:14px; }
.row input[type="text"], .row input[type="password"] { flex:1; height:30px; border:1px solid #ccc; padding:0 8px; border-radius:3px; }
.msg { font-size:12px; margin-left:8px; color:#e74c3c; white-space:nowrap; }
.btn { text-align:center; margin-top:15px; padding-left:75px; }
.btn input { background:#e74c3c; color:#fff; border:none; padding:8px 30px; border-radius:3px; cursor:pointer; font-size:14px; }
.btn input:hover { background:#c0392b; }
</style>
</head>
<body>

<div class="form">
<h2>用户注册验证</h2>
<form onsubmit="return checkAll()">
    <div class="row">
        <label>用户名</label>
        <input type="text" id="user" placeholder="至少6个字符">
        <span class="msg" id="ue"></span>
    </div>
    <div class="row">
        <label>密码</label>
        <input type="password" id="pwd" placeholder="至少8位，只能数字字母">
        <span class="msg" id="pe"></span>
    </div>
    <div class="row">
        <label>性别</label>
        <span style="flex:1;">
            <input type="radio" name="sex"> 男
            <input type="radio" name="sex" style="margin-left:10px;"> 女
        </span>
        <span class="msg" id="se"></span>
    </div>
    <div class="row">
        <label>爱好</label>
        <span style="flex:1;">
            <input type="checkbox" name="hobby"> 阅读
            <input type="checkbox" name="hobby" style="margin-left:8px;"> 运动
            <input type="checkbox" name="hobby" style="margin-left:8px;"> 音乐
        </span>
        <span class="msg" id="he"></span>
    </div>
    <div class="btn"><input type="submit" value="注册"></div>
</form>
</div>

<script>
var pwdReg = /^[0-9A-Za-z]+$/;

function checkUser() {
    var v = document.getElementById("user").value;
    if (v.length < 6) { document.getElementById("ue").innerHTML = "长度<6"; return false; }
    document.getElementById("ue").innerHTML = "✅"; return true;
}

function checkPwd() {
    var v = document.getElementById("pwd").value;
    if (v.length < 8) { document.getElementById("pe").innerHTML = "长度<8"; return false; }
    if (!pwdReg.test(v)) { document.getElementById("pe").innerHTML = "只能数字字母"; return false; }
    document.getElementById("pe").innerHTML = "✅"; return true;
}

function checkSex() {
    var nodes = document.getElementsByName("sex"), ok = false;
    for (var i=0; i<nodes.length; i++) { if (nodes[i].checked) ok = true; }
    if (!ok) { document.getElementById("se").innerHTML = "必选"; return false; }
    document.getElementById("se").innerHTML = "✅"; return true;
}

function checkHobby() {
    var nodes = document.getElementsByName("hobby"), ok = false;
    for (var i=0; i<nodes.length; i++) { if (nodes[i].checked) ok = true; }
    if (!ok) { document.getElementById("he").innerHTML = "必选"; return false; }
    document.getElementById("he").innerHTML = "✅"; return true;
}

function checkAll() {
    if (checkUser() && checkPwd() && checkSex() && checkHobby()) {
        alert("验证通过！");
        return false;
    }
    return false;
}
</script>

</body>
</html>
