<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>浮动布局 float</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"微软雅黑",sans-serif; background:#f5f5f5; padding:30px; color:#333; }
.container { max-width:650px; margin:0 auto; }
h2 { text-align:center; margin:20px 0; }

.float-img { float:left; width:120px; height:80px; background:#3498db; color:#fff; text-align:center; line-height:80px; margin-right:15px; margin-bottom:10px; border-radius:4px; }
.clear { clear:both; }

.fix { overflow:hidden; border:2px solid #27ae60; padding:10px; border-radius:6px; margin:15px 0; }
.no-fix { border:2px solid #e74c3c; padding:10px; border-radius:6px; margin:15px 0; }
</style>
</head>
<body>
<div class="container">

<h2>float 文字环绕</h2>
<div class="fix">
    <div class="float-img">float 图片</div>
    <p>文字会自动环绕在浮动元素周围。父元素加了 overflow:hidden 所以背景色包含浮动元素，不会塌陷。</p>
    <div class="clear"></div>
</div>

<h2>没有清除浮动 → 父元素塌陷</h2>
<div class="no-fix">
    <div class="float-img">float 图片</div>
    <p>父元素高度塌陷，边框和浮动元素不匹配。</p>
</div>

</div>
</body>
</html>
