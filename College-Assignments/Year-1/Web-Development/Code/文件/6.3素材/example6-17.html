<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>3D变形用法</title>
		<style type="text/css">
			#wrapper{
				width: 200px;
				height: 200px;
				border: 1px solid black;
				perspective: 200px;
			}
			#box{
				width: 200px;
				height: 200px;
				display: flex;
				justify-content: center;
				align-items: center;
				position: relative;
				transform-style: preserve-3d;
				transition: all 5s;
			}
			#box div{
				width: 100px;
				height: 100px;
				position: absolute;
			}
			#box div:nth-child(1){
				background-color: #00ffff;
				transform: translateZ(50px)
			}
			#box div:nth-child(2){
				background-color: #ffff00;
				transform: translateX(50px) rotateY(90deg);
			}
			#box div:nth-child(3){
				background-color: #ffaaff;
				transform: translateZ(-50px) rotateY(180deg);
			}
			#box div:nth-child(4){
				background-color: #ffaa00;
				transform: translateX(-50px) rotateY(-90deg);
			}
			#box:hover{
				transform: rotateY(360deg);
			}
		</style>
	</head>
	<body>
		<div id="wrapper">
			<div id="box">
				<div>1</div>
				<div>2</div>
				<div>3</div>
				<div>4</div>
			</div>
		</div>
	</body>
</html>
