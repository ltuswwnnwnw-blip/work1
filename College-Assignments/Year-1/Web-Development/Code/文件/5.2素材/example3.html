<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>父元素和子元素外边距合并</title>
		<style type="text/css">
			#outer{
				background-color: #00bcd4;
				width: 200px;
				height: 200px;
			}
			#inner{
				background-color: #ff9800;
				width: 100px;
				height: 100px;
			}
		</style>
	</head>
	<body>
		<div id="outer">
			<div id="inner">子div</div>
		</div>
	</body>
</html>
