<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>相邻元素垂直外边距合并</title>
		<style type="text/css">
			div{	
				width: 150px;	
				height: 150px; 
			}
			#top{
				background-color: #00bcd4;
			}
			#under{
				background-color: #ff9800;
			}
		</style>
	</head>
	<body>
		<div id="top">上方的div</div>
		<div id="under">下方的div</div>
	</body>
</html>
