<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>表单数据验证</title>
    <style>
        #register { width: 380px; border: 1px solid gray; font-size: 14px; padding: 8px; }
        #register h2 { text-align: center; }
        #register span { display: inline-block; width: 100px; text-align: right; }
        #register em { font-size: 12px; color: red; }
    </style>
</head>
<body>
    <div id="register">
        <h2>用户注册</h2>
        <form action="ok.html" method="get" onsubmit="return checkAll();">
            <p>
                <span>用户名：</span>
                <input type="text" name="user" id="user" value="">
                <em></em>
            </p>
            <p>
                <span>密码：</span>
                <input type="password" name="pwd" id="pwd" value="">
                <em></em>
            </p>
            <p>
                <span>性别：</span>
                <input type="radio" name="sex" value="男">男
                <input type="radio" name="sex" value="女">女
                <em></em>
            </p>
            <p>
                <span>业余爱好：</span>
                <input type="checkbox" name="interest" value="阅读">阅读
                <input type="checkbox" name="interest" value="运动">运动
                <input type="checkbox" name="interest" value="旅游">旅游
                <em></em>
            </p>
            <p>
                <span></span>
                <input type="submit" value="注册">
                <input type="reset" value="重置">
            </p>
        </form>
    </div>

    <script>
        var emNodes, userNode, pwdNode, sexNodes, interestNodes;

        window.onload = function () {
            emNodes = document.getElementsByTagName("em");
            userNode = document.getElementById("user");
            pwdNode = document.getElementById("pwd");
            sexNodes = document.getElementsByName("sex");
            interestNodes = document.getElementsByName("interest");
        };

        function checkUser() {
            if (userNode.value.length < 6) {
                emNodes[0].innerHTML = "长度不能小于6";
                return false;
            } else {
                emNodes[0].innerHTML = "";
                return true;
            }
        }

        function checkPwd() {
            var reg = /^[0-9A-Za-z]+$/;
            var s = pwdNode.value;
            if (s.length < 8) {
                emNodes[1].innerHTML = "长度不能小于8";
                return false;
            } else if (!reg.test(s)) {
                emNodes[1].innerHTML = "只能包含数字和字母";
                return false;
            } else {
                emNodes[1].innerHTML = "";
                return true;
            }
        }

        function checkSex() {
            var mark = false;
            for (var i = 0; i < sexNodes.length; i++) {
                if (sexNodes[i].checked) {
                    mark = true;
                }
            }
            if (mark == false) {
                emNodes[2].innerHTML = "必选";
                return false;
            } else {
                emNodes[2].innerHTML = "";
                return true;
            }
        }

        function checkInterest() {
            var mark = false;
            for (var i = 0; i < interestNodes.length; i++) {
                if (interestNodes[i].checked) {
                    mark = true;
                }
            }
            if (mark == false) {
                emNodes[3].innerHTML = "必选";
                return false;
            } else {
                emNodes[3].innerHTML = "";
                return true;
            }
        }

        function checkAll() {
            if (checkUser() && checkPwd() && checkSex() && checkInterest()) {
                return true;
            } else {
                return false;
            }
        }
    </script>
</body>
</html>
