<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>时间日期类特效</title>
    <style>
        h1 { font-family: "Microsoft YaHei", sans-serif; border-bottom: solid 5px black; text-align: center; }
        #current { color: brown; text-align: center; }
    </style>
</head>
<body>
    <h1>JavaScript Date 对象</h1>
    <div id="current">当前时间：<span id="time"></span></div>

    <script>
        window.onload = function () {
            showTime();
        };

        function showTime() {
            var nowDate = new Date();
            var year = nowDate.getFullYear();
            var month = nowDate.getMonth() + 1;
            var date = nowDate.getDate();
            var day = nowDate.getDay();
            var hour = nowDate.getHours();
            var minutes = nowDate.getMinutes();
            var seconds = nowDate.getSeconds();

            switch (day) {
                case 0: day = "星期日"; break;
                case 1: day = "星期一"; break;
                case 2: day = "星期二"; break;
                case 3: day = "星期三"; break;
                case 4: day = "星期四"; break;
                case 5: day = "星期五"; break;
                case 6: day = "星期六"; break;
            }

            if (hour < 10) { hour = "0" + hour; }
            if (minutes < 10) { minutes = "0" + minutes; }
            if (seconds < 10) { seconds = "0" + seconds; }

            document.getElementById("time").innerHTML =
                year + "年" + month + "月" + date + "日 " + day + " " + hour + ":" + minutes + ":" + seconds;
            setTimeout("showTime()", 1000);
        }
    </script>
</body>
</html>
